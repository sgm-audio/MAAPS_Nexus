apiVersion: v1
kind: Service
metadata:
  name: maaps-service
  labels:
    app: maaps
spec:
  type: LoadBalancer
  selector:
    app: maaps
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: maaps-internal
  labels:
    app: maaps
spec:
  type: ClusterIP
  selector:
    app: maaps
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
