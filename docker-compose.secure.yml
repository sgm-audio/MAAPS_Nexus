version: '3.8'

services:
  # MAAPS API - Security Hardened Configuration
  maaps-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: maaps-api:latest
    container_name: maaps-api-secure
    restart: unless-stopped

    # Ports
    ports:
      - "8000:8000"

    # Environment variables (use .env file)
    environment:
      - ENVIRONMENT=production
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - METADATA_DB_PATH=/app/data/metadata.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

    # Persistent volumes (only what needs to persist)
    volumes:
      - maaps-data:/app/data:rw
      - maaps-logs:/app/logs:rw
      - maaps-backups:/app/backups:rw

    # Security: Read-only root filesystem
    read_only: true

    # Temporary filesystem for /tmp
    tmpfs:
      - /tmp:mode=1777,size=100m
      - /run:mode=0755,size=10m

    # Security options
    security_opt:
      - no-new-privileges:true  # Prevent privilege escalation
      - apparmor:unconfined     # Or use custom AppArmor profile

    # Drop all capabilities, add only what's needed
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Only allow binding to ports
      - CHOWN             # For file ownership changes
      - SETUID            # For user switching
      - SETGID

    # Resource limits (prevent DoS)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - maaps-network

    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # PostgreSQL Database (for future user authentication)
  postgres:
    image: postgres:16-alpine
    container_name: maaps-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${DB_NAME:-maaps}
      - POSTGRES_USER=${DB_USER:-maaps}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups:ro

    # Security
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maaps}"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Network
    networks:
      - maaps-network

    # Only expose internally (no external port)
    expose:
      - "5432"

  # Redis (for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: maaps-redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec

    volumes:
      - redis-data:/data

    # Security
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    # Network
    networks:
      - maaps-network

    # Only expose internally
    expose:
      - "6379"

  # Nginx Reverse Proxy (SSL/TLS termination)
  nginx:
    image: nginx:1.25-alpine
    container_name: maaps-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx

    # Security
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    # Network
    networks:
      - maaps-network

    depends_on:
      - maaps-api

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: maaps-prometheus
    restart: unless-stopped

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    # Security
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Network
    networks:
      - maaps-network

    # Only expose internally
    expose:
      - "9090"

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: maaps-grafana
    restart: unless-stopped

    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitoring.yourdomain.com

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro

    # Security
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Network
    networks:
      - maaps-network

    # Only expose internally
    expose:
      - "3000"

    depends_on:
      - prometheus

# Networks
networks:
  maaps-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Persistent volumes
volumes:
  maaps-data:
    driver: local
  maaps-logs:
    driver: local
  maaps-backups:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-cache:
    driver: local
  nginx-logs:
    driver: local
