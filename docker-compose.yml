version: '3.8'

services:
  maaps:
    build: .
    container_name: maaps-production
    restart: unless-stopped

    # Environment configuration
    env_file:
      - .env.production

    # Volume mounts for persistence
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./config.json:/app/config.json:ro

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "from src.system import create_system; s=create_system(); s.start(); print(s.get_health()['health_score']); s.stop()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

    # Network (if you add API)
    # ports:
    #   - "8000:8000"

    # Security
    security_opt:
      - no-new-privileges:true

    # User (run as non-root in production)
    # user: "1000:1000"

# Optional: Add monitoring service
  # monitoring:
  #   image: prom/prometheus
  #   container_name: maaps-monitoring
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"

# Volumes for data persistence
volumes:
  maaps-data:
  maaps-logs:
  maaps-backups:
