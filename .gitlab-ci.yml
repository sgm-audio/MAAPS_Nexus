# GitLab CI/CD Pipeline for MAAPS

stages:
  - lint
  - test
  - build
  - deploy
  - monitor

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_DRIVER: overlay2

# Cache configuration
cache:
  paths:
    - .cache/pip
    - venv/

# Before script for most jobs
.before_script_template: &before_script
  before_script:
    - python -V
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

# Lint stage
lint:black:
  stage: lint
  image: python:3.11
  <<: *before_script
  script:
    - pip install black
    - black --check src/ tests/ api/
  allow_failure: true

lint:flake8:
  stage: lint
  image: python:3.11
  <<: *before_script
  script:
    - pip install flake8
    - flake8 src/ tests/ api/ --max-line-length=100

lint:mypy:
  stage: lint
  image: python:3.11
  <<: *before_script
  script:
    - pip install mypy
    - mypy src/ --ignore-missing-imports
  allow_failure: true

# Test stage
test:unit:
  stage: test
  image: python:3.11
  <<: *before_script
  script:
    - apt-get update && apt-get install -y libsndfile1 libsndfile1-dev
    - pip install pytest pytest-cov
    - mkdir -p data logs backups
    - pytest tests/ -v --cov=src --cov-report=term --cov-report=html
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week

test:integration:
  stage: test
  image: python:3.11
  <<: *before_script
  script:
    - apt-get update && apt-get install -y libsndfile1 libsndfile1-dev
    - python start_using_maaps.py
  allow_failure: true

# Security stage
security:bandit:
  stage: test
  image: python:3.11
  script:
    - pip install bandit
    - bandit -r src/ -f json -o bandit-report.json
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

security:safety:
  stage: test
  image: python:3.11
  script:
    - pip install safety
    - safety check --json > safety-report.json
  artifacts:
    paths:
      - safety-report.json
    expire_in: 1 week
  allow_failure: true

# Build stage
build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - develop

# Deploy to development
deploy:development:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $DEV_SERVER "cd /opt/maaps && docker-compose pull && docker-compose up -d"
  environment:
    name: development
    url: https://dev.maaps.example.com
  only:
    - develop

# Deploy to production
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $PROD_SERVER "cd /opt/maaps && docker-compose pull && docker-compose up -d"
  environment:
    name: production
    url: https://maaps.example.com
  when: manual
  only:
    - main

# Monitoring
monitor:health:
  stage: monitor
  image: curlimages/curl:latest
  script:
    - sleep 30  # Wait for deployment
    - curl -f https://maaps.example.com/health || exit 1
  only:
    - main
  needs:
    - deploy:production
