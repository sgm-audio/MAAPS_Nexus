name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: contact
    attributes:
      label: Contact Details (optional)
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com or @username on GitHub
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of MAAPS are you running?
      options:
        - v0.1.0 (Latest)
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: other-version
    attributes:
      label: If other version, specify
      placeholder: e.g., development branch commit hash

  - type: dropdown
    id: browsers
    attributes:
      label: What platform are you seeing the problem on?
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify below)

  - type: textarea
    id: platform-details
    attributes:
      label: Platform Details
      description: Specify OS version, Python version, and any relevant environment details
      placeholder: Ubuntu 22.04, Python 3.11, CUDA 11.8

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
      value: |
        1. 
        2. 
        3. 

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
